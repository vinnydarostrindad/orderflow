<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/waiter/tables/style.css" />
    <title>Tables</title>
  </head>
  <body>
    <app-header button="menu"></app-header>

    <waiter-nav></waiter-nav>

    <main class="main">
      <div class="tables-box">
        <button class="tables-box__add-btn" id="createTable">
          Criar Mesa <span class="plus-sign">+</span>
        </button>
        <div class="tables-box__tables" id="tables">
          <div class="table-card-skeleton skeleton"></div>
          <div class="table-card-skeleton skeleton"></div>
          <div class="table-card-skeleton skeleton"></div>
          <div class="table-card-skeleton skeleton"></div>
        </div>
      </div>
    </main>

    <div class="modal-bg modal-bg--hidden">
      <div class="all-tables-modal all-tables-modal--hidden"></div>

      <div class="table-name-modal table-name-modal--hidden">
        <p>Adicionar nome:</p>
        <input
          type="text"
          id="tableInputName"
          placeholder="Opcional"
          autocomplete="off"
        />
        <button class="primary-btn btn" id="tableNameInputContinueBtn">
          Continuar
        </button>
      </div>
    </div>

    <app-snackbar id="snackbar"></app-snackbar>

    <script type="module" src="/waiter/tables/script.js"></script>
  </body>
</html>
