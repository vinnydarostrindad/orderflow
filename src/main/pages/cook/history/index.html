<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/cook/history/style.css" />
    <title>Histórico</title>
  </head>
  <body>
    <app-header button="menu"></app-header>

    <cook-nav></cook-nav>

    <main class="main">
      <section class="orders-done">
        <header class="orders-in-progress__header">
          <h2>Prontos</h2>
        </header>
        <div class="orders__skeleton">
          <div class="orders__item-skeleton skeleton"></div>
        </div>
        <div class="orders-done__items" id="ordersReadyContainer"></div>
      </section>
      <section class="orders-delivered">
        <header class="orders-delivered__header">
          <h2>Entregues</h2>
        </header>
        <div class="orders__skeleton">
          <div class="orders__item-skeleton skeleton"></div>
        </div>
        <div
          class="orders-delivered__items"
          id="ordersDeliveredContainer"
        ></div>
      </section>
      <section class="orders-cancelled">
        <header class="orders-cancelled__header">
          <h2>Cancelados</h2>
        </header>
        <div class="orders__skeleton">
          <div class="orders__item-skeleton skeleton"></div>
        </div>
        <div
          class="orders-cancelled__items"
          id="ordersCancelledContainer"
        ></div>
      </section>
      <div
        class="all-order-info-container all-order-info-container--hidden"
        id="orderInfoContainer"
      >
        <div class="all-order-info">
          <div class="all-order-info__header">
            <div class="all-order-info__img">
              <img id="orderImg" src="" alt="" />
            </div>
            <div class="all-order-info__text">
              <h2 class="all-order-info__name" id="orderName"></h2>
              <p class="all-order-info__table" id="orderTable"></p>
              <p class="all-order-info__quantity" id="orderQuantity"></p>
              <p class="all-order-info__time" id="orderTime"></p>
            </div>
          </div>
          <p class="all-order-info__notes" id="orderNotes"></p>
          <div class="all-order-info__ingredients" id="orderIngredients"></div>
          <div class="all-order-info__btns">
            <button type="button" class="btn ghost-btn" id="closeOrderInfoBtn">
              Voltar
            </button>
            <button
              type="button"
              class="btn primary-btn"
              id="setOrderToInProgressBtn"
            >
              Voltar para Em Andamento
            </button>
          </div>
        </div>
      </div>
    </main>

    <app-snackbar id="snackbar"></app-snackbar>

    <script type="module" src="/cook/history/script.js"></script>
  </body>
</html>
