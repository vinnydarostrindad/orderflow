<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/cook/style.css" />
    <title>Cardápio</title>
  </head>
  <body>
    <app-header button="menu"></app-header>

    <cook-nav></cook-nav>

    <main class="main">
      <section class="orders-in-progress">
        <header class="orders-in-progress__header">
          <h2>Em Andamento</h2>
        </header>
        <div class="orders__skeleton">
          <div class="orders__item-skeleton skeleton"></div>
          <div class="orders__item-skeleton skeleton"></div>
          <div class="orders__item-skeleton skeleton"></div>
        </div>
        <div
          class="orders-in-progress__items"
          id="ordersInProgressContainer"
        ></div>
      </section>
      <section class="orders">
        <header class="orders__header">
          <h2>Pedidos</h2>
        </header>
        <section class="orders__box">
          <div class="orders__skeleton">
            <div class="orders__item-skeleton skeleton"></div>
            <div class="orders__item-skeleton skeleton"></div>
            <div class="orders__item-skeleton skeleton"></div>
          </div>
          <div class="orders__items" id="orderedItemsContainer"></div>
        </section>
      </section>
      <div
        class="all-order-info-container all-order-info-container--hidden"
        id="orderInfoContainer"
      >
        <div class="all-order-info">
          <div class="all-order-info__header">
            <div class="all-order-info__img">
              <img id="orderImg" src="" alt="" />
            </div>
            <div class="all-order-info__text">
              <h2 class="all-order-info__name" id="orderName"></h2>
              <p class="all-order-info__table" id="orderTable"></p>
              <p class="all-order-info__quantity" id="orderQuantity"></p>
              <p class="all-order-info__time" id="orderTime"></p>
            </div>
          </div>
          <p class="all-order-info__notes" id="orderNotes"></p>
          <div class="all-order-info__ingredients" id="orderIngredients"></div>
          <div class="all-order-info__btns">
            <div>
              <button
                type="button"
                class="btn ghost-btn"
                id="closeOrderInfoBtn"
              >
                Voltar
              </button>
              <button
                type="button"
                class="btn primary-btn"
                id="setOrderToDoneBtn"
              >
                Pronto
              </button>
            </div>
            <button
              type="button"
              class="all-order-info__btns__go-back"
              id="setOrderToPendingBtn"
            >
              Tirar de Em Andamento
            </button>
          </div>
        </div>
      </div>
    </main>

    <app-snackbar id="snackbar"></app-snackbar>

    <script type="module" src="/cook/script.js"></script>
  </body>
</html>
